{% extends "base.html" %}
{% block content %}

<h1>🛍 Shop</h1>

<div class="card">
  <form method="GET" action="/shop" class="search-bar">
    <input name="q" placeholder="Search products..." value="{{ search }}">
    <button type="submit">🔍 Search</button>
  </form>
  <div class="filter-row">
    <a href="/shop" class="filter-btn {{ 'active' if not active_cat else '' }}">All</a>
    {% for c in categories %}
      <a href="/shop?category={{ c.id }}"
         class="filter-btn {{ 'active' if active_cat == c.id else '' }}">{{ c.name }}</a>
    {% endfor %}
  </div>
</div>

<div class="product-grid">
  {% for p in products %}
    <div class="product-card">
      <a href="/product/{{ p.id }}">
        <img src="{{ p.image_url or 'https://via.placeholder.com/300x400' }}" alt="{{ p.name }}">
      </a>
      <h3><a href="/product/{{ p.id }}">{{ p.name }}</a></h3>
      <p class="price">Rs. {{ "%.2f"|format(p.price) }}</p>
      <p class="muted">{{ p.category.name if p.category else '' }}</p>
      <form method="POST" action="/add_to_cart/{{ p.id }}">
        <button type="submit">🛒 Add to Cart</button>
      </form>
    </div>
  {% else %}
    <p>No products found.</p>
  {% endfor %}
</div>

{% endblock %}

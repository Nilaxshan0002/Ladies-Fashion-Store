{% extends "base.html" %}
{% block content %}

<h1>{{ 'Edit Product' if product else 'Add New Product' }}</h1>

<div class="card">
  <form method="POST">
    <div class="grid2">
      <input name="name" placeholder="Product name" required value="{{ product.name if product else '' }}">
      <input name="price" type="number" step="0.01" placeholder="Price (Rs.)" required value="{{ product.price if product else '' }}">
      <input name="size" placeholder="Size (S,M,L)" value="{{ product.size if product else '' }}">
      <input name="color" placeholder="Color" value="{{ product.color if product else '' }}">
      <input name="stock" type="number" placeholder="Stock quantity" value="{{ product.stock if product else 10 }}">
      <input name="image_url" placeholder="Image URL" value="{{ product.image_url if product else '' }}">
      <select name="category_id">
        <option value="">-- Category --</option>
        {% for c in categories %}
          <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
    <textarea name="description" placeholder="Description" rows="4">{{ product.description if product else '' }}</textarea>
    <button type="submit">{{ '💾 Save' if product else '➕ Add Product' }}</button>
    <a href="/admin" class="btn-cancel">Cancel</a>
  </form>
</div>

{% endblock %}
